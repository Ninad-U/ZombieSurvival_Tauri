[package]
name = "zombie_survival"
version = "0.1.0"
description = "ZombieSurvival - Native Windows Desktop Application"
authors = ["ZombieSurvival Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[package.metadata.tauri]
icon = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
